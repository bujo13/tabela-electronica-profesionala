<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabela electronică profesională — Comandă</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#101820;color:#f4f6f8;margin:0;padding:16px}
main{max-width:760px;margin:auto}h1{font-size:24px;margin:4px 0 8px}.hint{color:#b9c2cc;font-size:14px;margin-bottom:18px}
.panel{background:#1d2935;border:1px solid #344454;border-radius:14px;padding:16px;margin:12px 0}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{min-width:0}
label{display:block;font-size:14px;color:#cbd5df;margin:8px 0 5px}
input[type=text]{width:100%;padding:11px;border-radius:8px;border:1px solid #526273;background:#101820;color:white;font-size:17px}
input[type=color]{width:100%;height:42px;border:0;background:transparent}
button{border:0;border-radius:9px;padding:12px 14px;font-weight:700;font-size:16px;cursor:pointer;background:#dce5ed;color:#101820}
button:active{transform:scale(.98)}.scorebuttons{display:flex;gap:8px;margin-top:8px}.scorebuttons button{flex:1}
.primary{background:#55c28a}.stop{background:#f3bd59}.reset{background:#e58d8d}
.timer{font-variant-numeric:tabular-nums;text-align:center;font-size:42px;font-weight:800;letter-spacing:1px;margin:6px}
.timerbuttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.adjust{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.adjust button{padding:10px 3px;font-size:14px}
.links a{color:#8cc8ff;overflow-wrap:anywhere}.status{font-size:13px;color:#9db0c0}
@media(max-width:480px){body{padding:10px}.panel{padding:12px}.adjust{grid-template-columns:repeat(3,1fr)}.timer{font-size:38px}}
</style></head>
<body><main>
<h1>Tabela electronică profesională</h1>
<div class="hint">Panou de comandă. Deschide separat adresa <b>/overlay</b> pe telefonul sau dispozitivul care afișează tabela.</div>
<div class="panel">
  <div class="teams">
    <div class="team">
      <label for="homeName">Numele gazdelor</label><input id="homeName" type="text" maxlength="32" value="Gazde">
      <label for="homeColor">Culoarea gazdelor</label><input id="homeColor" type="color" value="#1769aa">
      <div class="scorebuttons"><button onclick="score('home',-1)">− Scor</button><button onclick="score('home',1)">+ Scor</button></div>
    </div>
    <div class="team">
      <label for="awayName">Numele oaspeților</label><input id="awayName" type="text" maxlength="32" value="Oaspeți">
      <label for="awayColor">Culoarea oaspeților</label><input id="awayColor" type="color" value="#b3261e">
      <div class="scorebuttons"><button onclick="score('away',-1)">− Scor</button><button onclick="score('away',1)">+ Scor</button></div>
    </div>
  </div>
  <div class="status" id="connection">Se conectează…</div>
</div>
<div class="panel">
  <div class="timer" id="timer">00:00</div>
  <div class="timerbuttons">
    <button class="primary" onclick="timerAction('start')">START</button>
    <button class="stop" onclick="timerAction('stop')">STOP</button>
    <button class="reset" onclick="timerAction('reset')">RESET 00:00</button>
  </div>
  <label>Ajustare timp (secunde)</label>
  <div class="adjust">
    <button onclick="adjust(-10)">−10 sec</button><button onclick="adjust(-5)">−5 sec</button><button onclick="adjust(-1)">−1 sec</button>
    <button onclick="adjust(1)">+1 sec</button><button onclick="adjust(5)">+5 sec</button><button onclick="adjust(10)">+10 sec</button>
  </div>
</div>
<div class="panel links">Adresă de afișare: <a id="overlayLink" href="/overlay" target="_blank">/overlay</a><br><span class="status">Pe Render, folosește aceeași adresă a serviciului și adaugă /overlay.</span></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);
function command(data){socket.emit("command",data)}
function score(team,delta){command({type:"score",team,delta})}
function timerAction(action){command({type:"timer",action})}
function adjust(seconds){command({type:"timer",action:"adjust",seconds})}
let state = null;
function format(ms){const total=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0")}
socket.on("connect",()=>{$("connection").textContent="Conectat — comenzile se sincronizează";$("overlayLink").href=location.origin+"/overlay";$("overlayLink").textContent=location.origin+"/overlay"});
socket.on("disconnect",()=>{$("connection").textContent="Conexiune întreruptă — verifică internetul"});
socket.on("state",s=>{
 state=s;
 $("timer").textContent=format(s.elapsedMs);
 if(document.activeElement!==$("homeName"))$("homeName").value=s.homeName;
 if(document.activeElement!==$("awayName"))$("awayName").value=s.awayName;
 $("homeColor").value=s.homeColor;$("awayColor").value=s.awayColor;
});
$("homeName").addEventListener("change",()=>command({type:"team",team:"home",name:$("homeName").value,color:$("homeColor").value}));
$("awayName").addEventListener("change",()=>command({type:"team",team:"away",name:$("awayName").value,color:$("awayColor").value}));
$("homeColor").addEventListener("input",()=>command({type:"team",team:"home",name:$("homeName").value,color:$("homeColor").value}));
$("awayColor").addEventListener("input",()=>command({type:"team",team:"away",name:$("awayName").value,color:$("awayColor").value}));
</script></body></html>
